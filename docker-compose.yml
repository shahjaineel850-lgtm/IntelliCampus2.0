version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: aurora_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aurora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aurorasecret}
      POSTGRES_DB: ${POSTGRES_DB:-auroraclassroom}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurora -d auroraclassroom"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aurora_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://aurora:aurorasecret@db:5432/auroraclassroom
      SYNC_DATABASE_URL: postgresql://aurora:aurorasecret@db:5432/auroraclassroom
      SECRET_KEY: ${SECRET_KEY:-hackathon2026_super_secret_jwt_key_aurora}
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      BACKEND_CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000"]'
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aurora_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
      NEXT_PUBLIC_DEMO_MODE: "false"
    depends_on:
      - backend

volumes:
  postgres_data:
